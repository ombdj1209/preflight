[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "preflight"
version = "0.1.0"
description = "Decision-impact sandbox for automated fulfilment centres"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.0", "duckdb>=1.5.5", "scikit-learn>=1.4"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["preflight"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
